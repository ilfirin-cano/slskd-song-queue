services:
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    ports:
      - "5030:5030"
      - "5031:5031"
      - "50300:50300"
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
    volumes:
      - ./slskd-data:/app
    restart: unless-stopped

  song-queue:
    build: .
    container_name: slskd-song-queue
    ports:
      - "8080:8080"
    environment:
      SLSKD_URL: "http://slskd:5030"
      SLSKD_API_KEY: "${SLSKD_API_KEY}"
      SEARCH_TIMEOUT_MS: "25000"
      MAX_WAIT_SECONDS: "35"
      MIN_MATCH_SCORE: "0.52"
    depends_on:
      - slskd
    restart: unless-stopped
