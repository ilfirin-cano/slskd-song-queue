services:
  song-queue:
    build: .
    container_name: slskd-song-queue
    # Share the already-running Gluetun network namespace.
    # Port publishing and Docker networks are configured on Gluetun itself.
    network_mode: "container:gluetun"
    environment:
      SLSKD_URL: "${SLSKD_URL:-http://slskd:5030}"
      SLSKD_API_KEY: "${SLSKD_API_KEY}"
      SEARCH_DURATION_SECONDS: "${SEARCH_DURATION_SECONDS:-25}"
      SEARCH_WAIT_GRACE_SECONDS: "${SEARCH_WAIT_GRACE_SECONDS:-5}"
      DEEP_SEARCH_DURATION_SECONDS: "${DEEP_SEARCH_DURATION_SECONDS:-60}"
      DEEP_SEARCH_MIN_MATCH_SCORE: "${DEEP_SEARCH_MIN_MATCH_SCORE:-0.50}"
      DEEP_SEARCH_RESPONSE_LIMIT: "${DEEP_SEARCH_RESPONSE_LIMIT:-250}"
      RETRY_NOT_FOUND_BY_DEFAULT: "${RETRY_NOT_FOUND_BY_DEFAULT:-true}"
      MAX_PARALLEL_SEARCHES: "${MAX_PARALLEL_SEARCHES:-2}"
      SEARCH_START_INTERVAL_SECONDS: "${SEARCH_START_INTERVAL_SECONDS:-1}"
      MIN_MATCH_SCORE: "${MIN_MATCH_SCORE:-0.52}"
      POLL_INTERVAL: "${POLL_INTERVAL:-1}"
      MAX_RESULTS_PER_SONG: "${MAX_RESULTS_PER_SONG:-100}"
      SLSKD_429_RETRIES: "${SLSKD_429_RETRIES:-5}"
      TRANSFER_POLL_INTERVAL: "${TRANSFER_POLL_INTERVAL:-2}"
      TRANSFER_MONITOR_HOURS: "${TRANSFER_MONITOR_HOURS:-24}"
    restart: unless-stopped
